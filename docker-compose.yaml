services:
  jenkins:
    build:
      context: ./jenkins
    image: task-jenkins
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home

  gerrit:
    image: gerritcodereview/gerrit:3.14.5
    container_name: gerrit
    environment:
      - CANONICAL_WEB_URL=http://localhost:8080/
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "29418:29418"
    volumes:
      - gerrit_data:/var/gerrit

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-app
    restart: unless-stopped
    ports:
      - "8082:8080"  # host 8080 is Gerrit and 8081 is Jenkins
    environment:
      - APP_ENV=compose

volumes:
  jenkins_data:
  gerrit_data:
