apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: task-prod
resources:
  - namespace.yaml
  - ../../base
replicas:
  - name: task
    count: 3
images:
  - name: task-app
    newTag: 292dfa4
configMapGenerator:
  - name: task-config
    behavior: merge
    literals:
      - APP_ENV=prod
      - APP_VERSION=292dfa4
