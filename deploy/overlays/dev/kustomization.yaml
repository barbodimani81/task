apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: task-dev
resources:
  - namespace.yaml
  - ../../base
replicas:
  - name: task
    count: 1
images:
  - name: task-app
    newTag: 13b4764
  - name: task-migrate
    newTag: 61364d2
configMapGenerator:
  - name: task-config
    behavior: merge
    literals:
      - APP_ENV=dev
      - APP_VERSION=13b4764
